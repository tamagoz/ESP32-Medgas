<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Outer Gauge Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="24" stroke-linecap="round" />
  <path d="M 128 384 A 180 180 0 1 1 384 384" fill="none" stroke="url(#cyanGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />

  <!-- Medical Cross / Gas Pulse in Center -->
  <g transform="translate(256, 256)">
    <!-- Cross vertical bar -->
    <rect x="-24" y="-80" width="48" height="160" rx="16" fill="url(#emeraldGrad)" />
    <!-- Cross horizontal bar -->
    <rect x="-80" y="-24" width="160" height="48" rx="16" fill="url(#emeraldGrad)" />
    
    <!-- Central Dial Indicator Needle -->
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="8" />
    <polygon points="0,-12 12,0 0,64 -12,0" fill="#38bdf8" transform="rotate(42)" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
  </g>

  <!-- Small text label 'MEDGAS v3.1' -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#94a3b8" letter-spacing="4" text-anchor="middle">MEDGAS v3.1</text>
</svg>
